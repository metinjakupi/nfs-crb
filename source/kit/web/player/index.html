<!doctype html>
<!-- The player page for one game's web build. tools/web_launcher.py places it,
     with @APP@.js/.wasm/.data, in <launcher>/<game id>/; the game's files were
     imported by the launcher into the browser's private storage at
     <game id>/game, and the profile lives at <game id>/profile. The page must
     be served cross-origin isolated (COOP same-origin, COEP require-corp). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 0 16px; white-space: pre-line; pointer-events: none; }
  #status a { pointer-events: auto; color: #8cf; }
  #status[hidden] { display: none; }
  #runtime-loader { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 20%, #112b3e, #04080d 65%); overflow: auto; box-sizing: border-box; }
  #runtime-loader[hidden] { display: none; }
  .cl-panel { width: min(100%, 480px); padding: clamp(24px, 5vw, 40px); box-sizing: border-box; background: #09141ee8; border: 1px solid #263c4b; border-top: 2px solid #6adce6; box-shadow: 0 24px 100px #0007; color: #eaf6fb; text-align: left; }
  .cl-kicker { margin: 0 0 20px; color: #7edfe8; letter-spacing: .18em; font-size: 11px; font-weight: 700; }
  .cl-panel h1 { margin: 0 0 12px; font-size: clamp(25px, 5vw, 34px); line-height: 1.15; letter-spacing: -.03em; }
  #cl-message { min-height: 3em; margin: 0 0 28px; color: #a6bbc9; font-size: 14px; line-height: 1.5; }
  .cl-label { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 20px 0 9px; font-size: 13px; }
  .cl-label span:last-child { color: #91aebb; text-align: right; font-variant-numeric: tabular-nums; }
  .cl-panel progress { display: block; width: 100%; height: 5px; border: 0; border-radius: 0; appearance: none; background: #1b2d3b; color: #6adce6; overflow: hidden; }
  .cl-panel progress::-webkit-progress-bar { background: #1b2d3b; }
  .cl-panel progress::-webkit-progress-value { background: linear-gradient(90deg, #2281b4, #7ce8e4); }
  .cl-panel progress::-moz-progress-bar { background: #6adce6; }
  .cl-panel progress:indeterminate { background: linear-gradient(90deg, #1b2d3b 20%, #4fbdc9 50%, #1b2d3b 80%); background-size: 200% 100%; animation: cl-wait 2s linear infinite; }
  .cl-panel progress:indeterminate::-webkit-progress-bar { background: transparent; }
  .cl-prepare { display: flex; justify-content: space-between; gap: 14px; margin-top: 25px; padding-top: 18px; border-top: 1px solid #233642; color: #a6bbc9; font-size: 13px; }
  .cl-footer { margin: 28px 0 0; color: #76909f; font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  #cl-reload { min-height: 44px; margin-top: 18px; padding: 10px 18px; background: #173340; color: #eaf6fb; border: 1px solid #537987; font: inherit; cursor: pointer; }
  #cl-reload[hidden] { display: none; }
  #cl-reload:hover { background: #244956; } #cl-reload:active { background: #315b68; }
  #cl-reload:focus-visible { outline: 2px solid #91f5ed; outline-offset: 4px; }
  @keyframes cl-wait { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .cl-panel progress:indeterminate { animation: none; } }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<section id="runtime-loader" hidden aria-labelledby="cl-title">
  <div class="cl-panel">
    <p class="cl-kicker">STARTING GAME</p>
    <h1 id="cl-title">Loading your game</h1>
    <p id="cl-message" role="status" aria-live="polite">Game data and game code load separately.</p>
    <div class="cl-label"><span>Game data</span><span id="cl-data-text">Waiting…</span></div>
    <progress id="cl-data" max="1" aria-label="Game data loading"></progress>
    <div class="cl-label"><span>Game code</span><span id="cl-code-text">Waiting…</span></div>
    <progress id="cl-code" max="1" aria-label="Game code loading"></progress>
    <div class="cl-prepare"><span>Preparing game</span><span id="cl-prepare-text">Waiting</span></div>
    <p class="cl-footer"><span id="cl-elapsed">0:00 elapsed</span><br>Your saves and settings are kept.</p>
    <button id="cl-reload" type="button" hidden>Reload game</button>
  </div>
</section>

<script>if (document.documentElement.dataset.gameId) window.recompSite = true;</script>
<script src="report.js"></script>
<script>
"use strict";
const canonicalRedirect = location.hostname.endsWith(".");
if (canonicalRedirect) {
  const canonical = new URL(location.href);
  canonical.hostname = canonical.hostname.slice(0, -1);
  location.replace(canonical.href);
}
const graphicsRecovery = new URLSearchParams(location.search).get("graphicsRecovery") === "1";
const statusEl = document.getElementById("status");
const canvas = document.getElementById("canvas");
let gameRunning = false;
let statusFailed = false;
let runtimeLoader = null;
let startupPhase = "start page";
window.recompStartupPhase = startupPhase;
function startup(phase) {
  startupPhase = phase;
  window.recompStartupPhase = phase;
  diagnostics.phases.push({ phase, at: new Date().toISOString() });
  if (diagnostics.phases.length > 30) diagnostics.phases.shift();
}
function status(text, back, backText = "Back to game") {
  // Startup progress must not cover play or erase a fatal error.
  if (!back && (gameRunning || statusFailed)) return;
  if (back) { statusFailed = true; stopRuntimeLoader(); }
  else if (runtimeLoader?.active) { renderRuntimeLoader(); return; }
  statusEl.textContent = text;
  if (back) {
    const a = document.createElement("a");
    a.href = document.documentElement.dataset.gameId ? "/" : "../";
    a.textContent = `\n${backText}`;
    statusEl.append(document.createElement("br"), a);
    offerReport();
  }
  statusEl.hidden = !text;
}
// A game's report.js (if it has one) adds "Download log" and "Send report" to a stopped screen.
function offerReport() {
  const offer = () => { try { window.recompReport?.offer(statusEl); } catch {} };
  if (window.recompReport) return offer();
  const s = document.createElement("script");
  s.src = "report.js";
  s.onload = offer;
  s.onerror = () => s.remove();
  document.body.append(s);
}
const log = [];
window.recompLog = log; // for tests

// Keep early failures even when report.js has not loaded yet.
const diagnostics = window.carbonDiagnostics = { phases: [], failures: [], adapterRequests: [], downloads: [] };
function errorDetails(error) {
  if (typeof error === "string") return { name: "String", message: error.slice(0, 2000), stack: "" };
  let message;
  try { message = error?.message || JSON.stringify(error); } catch {}
  return { name: String(error?.name || typeof error), message: String(message || error || "Unknown error").slice(0, 2000),
    stack: String(error?.stack || "").slice(0, 5000), cause: error?.cause ? String(error.cause?.message || error.cause).slice(0, 1000) : undefined };
}
function diagnosticUrl(value) {
  try { const u = new URL(value, location.href); return u.origin + u.pathname; } catch { return ""; }
}
function noteDownload(record) {
  diagnostics.downloads.push({ at: new Date().toISOString(), ...record });
  if (diagnostics.downloads.length > 20) diagnostics.downloads.shift();
}
let reportingFailure = false;
function reportFailure(kind, error, extra = {}) {
  const detail = { kind, ...errorDetails(error), ...extra, phase: startupPhase, at: new Date().toISOString() };
  diagnostics.failures.push(detail);
  if (diagnostics.failures.length > 20) diagnostics.failures.shift();
  window.recompFailure ||= detail;
  if (reportingFailure) return;
  reportingFailure = true;
  const message = detail.message;
  status(`The game stopped: ${message}`, true, kind === "startup-storage" ? "Open game page" : "Back to game");
  const record = { ...detail, game: location.pathname,
    log: log.slice(-20).map(t => String(t).slice(0, 300)) };
  fetch("/_runtime-diagnostics", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(record), keepalive: true,
  }).catch(() => {});
}
function humanBytes(bytes) {
  let value = Math.max(0, Number(bytes) || 0), unit = 0;
  const units = ["B", "KiB", "MiB", "GiB"];
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
}
function stopRuntimeLoader() {
  if (runtimeLoader) { runtimeLoader.active = false; clearInterval(runtimeLoader.timer); runtimeLoader.observer?.disconnect(); }
  document.getElementById("runtime-loader").hidden = true;
}
function beginRuntimeLoader() {
  const now = Date.now();
  runtimeLoader = { active: true, started: now, data: {received: 0, total: Number(window.recompPageBuild?.dataBytes)||0, done: false},
    code: {received: 0, total: 0, done: false, lastAt: now, prepared: false}, retry: "" };
  document.getElementById("cl-reload").onclick = () => location.reload();
  if (typeof PerformanceObserver !== "undefined") {
    runtimeLoader.observer = new PerformanceObserver(list => {
      const l = runtimeLoader;
      if (!l?.active || !l.code.url) return;
      for (const entry of list.getEntries()) {
        if (entry.name !== l.code.url || entry.startTime < l.code.requestAt || !(entry.decodedBodySize > 0)) continue;
        l.code.done = true; l.code.received = entry.decodedBodySize;
        diagnostics.runtimeCodeProgress = {received:entry.decodedBodySize,total:l.code.total||null,downloadFinished:true,at:new Date().toISOString()};
        renderRuntimeLoader();
      }
    });
    try { runtimeLoader.observer.observe({type:"resource", buffered:true}); }
    catch { runtimeLoader.observer.disconnect(); runtimeLoader.observer = null; }
  }
  runtimeLoader.timer = setInterval(renderRuntimeLoader, 1000);
  renderRuntimeLoader();
}
function renderRuntimeLoader() {
  const l = runtimeLoader;
  if (!l?.active || statusFailed || gameRunning) return;
  const now = Date.now(), stalled = !l.code.done && now - l.code.lastAt >= 45000;
  const ready = l.data.done && l.code.done;
  document.getElementById("runtime-loader").hidden = false;
  statusEl.hidden = true;
  document.getElementById("cl-title").textContent = ready ? "Preparing your game" : "Loading your game";
  const message = stalled ? "Game code is still loading. Keep this tab open. You can reload if loading does not finish."
    : l.retry || (ready ? "Downloads finished. The browser is preparing the game. First launch can take longer."
      : l.data.done ? "Game data is ready. Game code is still loading." : "Game data and game code load separately.");
  const messageEl = document.getElementById("cl-message");
  if (messageEl.textContent !== message) messageEl.textContent = message;
  for (const kind of ["data", "code"]) {
    const item = l[kind], bar = document.getElementById("cl-"+kind);
    const comparable = item.total > 0 && item.received <= item.total;
    if (item.done || (comparable && kind !== "code")) { bar.max = item.total || Math.max(1,item.received); bar.value = item.received; }
    else bar.removeAttribute("value");
    document.getElementById("cl-"+kind+"-text").textContent = item.done ? "Ready"+(item.received ? " · "+humanBytes(item.received) : "")
      : item.received ? humanBytes(item.received)+(comparable ? " / "+humanBytes(item.total) : " received") : item.started ? "Loading…" : "Waiting…";
  }
  document.getElementById("cl-prepare-text").textContent = l.code.prepared ? "Ready" : l.code.done ? "Preparing…" : "Waiting";
  const seconds = Math.max(0, Math.floor((now-l.started)/1000));
  document.getElementById("cl-elapsed").textContent = `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")} elapsed`;
  document.getElementById("cl-reload").hidden = !stalled;
  statusEl.textContent = message; // Text fallback; the visible panel owns progress.
}
function noteRuntimeResponse(response) {
  if (!runtimeLoader?.active) return;
  const code = runtimeLoader.code;
  code.started = true; code.lastAt = Date.now(); runtimeLoader.retry = "";
  const decoded = Number(window.recompPageBuild?.wasmBytes || window.recompRuntimeBuild?.wasmBytes);
  const encoding = response.headers.get("Content-Encoding");
  code.total = Number.isFinite(decoded) && decoded > 0 ? decoded : !encoding || encoding === "identity" ? Number(response.headers.get("Content-Length")) || 0 : 0;
  renderRuntimeLoader();
}
function noSpaceError(result = {}) {
  const amounts = Number.isFinite(result.needed) && Number.isFinite(result.free)
    ? ` The game needs ${humanBytes(result.needed)}, but only ${humanBytes(result.free)} is free.` : "";
  const zeroFree = result.free === 0
    ? "\n\nThe browser reports 0 B free. Use a normal window, not a Private or Tor window. If Brave still reports 0 B, use an up-to-date Chrome or Edge browser."
    : "\n\nFree disk space on this device if the disk is nearly full.";
  const error = new Error(`The browser does not have enough storage for the game.${amounts}\n\nWhat to do:\n1. Select Open game page below.\n2. Select Delete downloaded files.\n3. Press Play again.${zeroFree}\n\nDeleting downloaded files keeps your saves and settings.`);
  error.name = "QuotaExceededError";
  return error;
}
async function reportStartupFailure(error) {
  if (staleStorageError(error)) {
    const recovery = new Error("The browser changed its game storage while Carbon was loading. Close other Carbon tabs, then select Open game page and press Play again. Your saves are kept.");
    recovery.name = "InvalidStateError";
    return reportFailure("startup-storage", recovery);
  }
  const full = error?.name === "QuotaExceededError" || /quota|not enough storage|ran out of storage/i.test(String(error?.message || error));
  if (!full) return reportFailure("startup", error);
  if (!/does not have enough storage/i.test(String(error?.message || ""))) {
    let free;
    try {
      const estimate = await navigator.storage.estimate();
      if (Number.isFinite(estimate.quota) && Number.isFinite(estimate.usage)) free = Math.max(0, estimate.quota - estimate.usage);
    } catch {}
    error = noSpaceError({ free });
  }
  reportFailure("startup-storage", error);
}
function staleStorageError(error) {
  return error?.name === "InvalidStateError" ||
    /state cached in an interface object.*changed since it was read from disk/i.test(String(error?.message || error));
}
window.addEventListener("error", e => {
  const extra = { source: diagnosticUrl(e.filename || e.target?.src || e.target?.href),
    line: e.lineno || 0, column: e.colno || 0, masked: !e.error && e.message === "Script error." };
  if (!e.error && !e.message) {
    // Resource errors do not bubble. Record them in capture phase, but an
    // optional image or script must not turn a running game into a fatal error.
    diagnostics.failures.push({ kind: "resource", message: "Resource failed to load", ...extra,
      phase: startupPhase, at: new Date().toISOString() });
    if (diagnostics.failures.length > 20) diagnostics.failures.shift();
    return;
  }
  reportFailure("error", e.error || e.message, extra);
}, true);
window.addEventListener("unhandledrejection", e => reportFailure("rejection", e.reason));

// Temporary loading diagnostics: bounded to the first ten minutes of a run.
let loadingReports = 0;
const loadingTimer = setInterval(() => {
  if (reportingFailure || ++loadingReports > 20) { clearInterval(loadingTimer); return; }
  const record = {
    kind: "loading-snapshot", game: location.pathname, time: new Date().toISOString(), phase: startupPhase,
    assets: window.carbonTestAssets || {},
    graphics: window.carbonGraphicsInfo || {},
    canvas: { width: canvas.width, height: canvas.height, dpr: devicePixelRatio },
    rendering: log.filter(t => /d3d9 webgpu:|d3d9 host:|audio sink:|sched: baton held/.test(String(t)))
      .slice(-10).map(t => String(t).slice(0, 500)),
    log: log.slice(-35).map(t => String(t).slice(0, 200)),
    warnings: log.filter(t => /missing|not found|failed|unimplemented|unknown|error/i.test(String(t)))
      .slice(-8).map(t => String(t).slice(0, 200)),
  };
  let body = JSON.stringify(record);
  while (new TextEncoder().encode(body).length > 14000 && record.log.length) {
    record.log.shift(); body = JSON.stringify(record);
  }
  fetch("/_runtime-diagnostics", {
    method: "POST", headers: { "Content-Type": "application/json" }, body,
  }).catch(() => {});
}, 30000);

// ?profile=<name>: this window keeps its saves and settings in profile-<name>,
// a copy of the main profile made the first time, so two windows of the same
// game (online play on one computer) never write the same save.
async function copyFolder(from, to) {
  for await (const [name, entry] of from.entries()) {
    if (entry.kind === "directory") {
      await copyFolder(entry, await to.getDirectoryHandle(name, { create: true }));
    } else {
      try {
        const data = await (await entry.getFile()).arrayBuffer();
        const out = await (await to.getFileHandle(name, { create: true })).createWritable();
        await out.write(data);
        await out.close();
      } catch (error) {
        console.warn(`[browser] could not copy ${name} into this window's profile: ${error.message}`);
      }
    }
  }
}

async function profileFolder(id, wanted) {
  const name = wanted || new URLSearchParams(location.search).get("profile");
  if (!name) return "profile";
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(name)) throw new Error("A profile name may use letters, digits, - and _.");
  const folder = `profile-${name}`;
  const game = await (await navigator.storage.getDirectory()).getDirectoryHandle(id);
  const target = await game.getDirectoryHandle(folder, { create: true });
  try {
    await target.getFileHandle(".copied");
  } catch {
    let main = null;
    try { main = await game.getDirectoryHandle("profile"); } catch {}
    if (main) await copyFolder(main, target);
    await (await (await target.getFileHandle(".copied", { create: true })).createWritable()).close();
  }
  return folder;
}

async function gameId() {
  if (document.documentElement.dataset.gameId) return document.documentElement.dataset.gameId;
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
  return decodeURIComponent(parts[parts.length - 1] || "");
}

function phoneInPortrait() {
  return matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 600 && innerHeight > innerWidth;
}

async function waitForPhoneLandscape() {
  if (!phoneInPortrait()) return;
  startup("waiting for landscape orientation");
  status("Rotate your phone to landscape to start.");
  await new Promise((resolve) => {
    const check = () => {
      if (phoneInPortrait()) return;
      removeEventListener("resize", check);
      removeEventListener("orientationchange", check);
      resolve();
    };
    addEventListener("resize", check);
    addEventListener("orientationchange", check);
  });
  // Let the browser resize its high-DPI canvas before SDL reads it once for
  // Carbon's resolution list.
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

// Match the desktop launcher's render scale: Screen is automatic, 1.5x and
// Game resolution are fixed multipliers. Read the selected profile before
// creating the renderer; the native setting is saved for the next start.
async function savedRenderScale(game, profile) {
  const config = game.renderScaleSetting;
  if (!config) return undefined;
  let choice = config.default;
  try {
    let dir = await navigator.storage.getDirectory();
    for (const part of [game.id, profile]) dir = await dir.getDirectoryHandle(part);
    const file = await (await dir.getFileHandle("mod-settings.json")).getFile();
    const value = JSON.parse(await file.text())[config.setting];
    if (Number.isInteger(value) && value >= 0 && value <= 2) choice = value;
  } catch (error) {
    if (error.name !== "NotFoundError") console.warn("[browser] could not read render resolution; using its default");
  }
  return choice === 1 ? "1.5" : choice === 2 ? "1" : undefined;
}

// Keep streaming compilation on phones: do not pre-buffer another full runtime.
// Retry covers response-body failures too, not just the initial fetch.
async function loadRuntime(imports) {
  const url = new URL("@APP@.wasm", document.baseURI).href;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      if (runtimeLoader?.active) Object.assign(runtimeLoader.code, {url, requestAt:performance.now(), received:0, done:false, prepared:false, started:false, lastAt:Date.now()});
      const response = await fetch(url, { credentials: "same-origin", cache: attempt ? "reload" : "default" });
      noteDownload({ phase: "runtime", attempt: attempt + 1, url: diagnosticUrl(url), status: response.status,
        contentType: response.headers.get("Content-Type"), contentLength: response.headers.get("Content-Length"),
        contentEncoding: response.headers.get("Content-Encoding") });
      if (!response.ok) {
        await response.body?.cancel();
        const error = new Error(`Game runtime download returned HTTP ${response.status}.`);
        error.retryable = response.status === 408 || response.status === 429 || response.status >= 500;
        throw error;
      }
      noteRuntimeResponse(response);
      // Keep the original network Response: replacing it loses browser code-cache metadata.
      const result = WebAssembly.instantiateStreaming && response.headers.get("Content-Type")?.split(";")[0].trim() === "application/wasm"
        ? await WebAssembly.instantiateStreaming(response, imports)
        : await WebAssembly.instantiate(await response.arrayBuffer(), imports);
      if (runtimeLoader?.active) { runtimeLoader.code.prepared = runtimeLoader.code.done = true; runtimeLoader.code.received ||= runtimeLoader.code.total; renderRuntimeLoader(); }
      return result;
    } catch (error) {
      noteDownload({ phase: "runtime", attempt: attempt + 1, url: diagnosticUrl(url), error: errorDetails(error) });
      if (error instanceof WebAssembly.CompileError || error instanceof WebAssembly.LinkError)
        throw new Error(`Could not compile or link the game runtime: ${error.message}`);
      if (error.retryable === false) throw error;
      if (attempt === 2)
        throw new Error("The game runtime could not be downloaded after three attempts. Check your connection and reload the page. Your saves are kept.", { cause: error });
      console.warn(`[browser] runtime download attempt ${attempt + 1} failed: ${error.message}`);
      if (runtimeLoader?.active) { runtimeLoader.retry = `Connection interrupted. Retrying game code (${attempt+2} of 3)…`; runtimeLoader.code.lastAt = Date.now(); }
      status(`Downloading game code… retry ${attempt + 2} of 3`);
      await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
    }
  }
}

// ChromeOS can invalidate an OPFS handle when another tab changes this origin's
// storage. A fresh worker opens fresh handles. Retry once; repeated failures are
// reported without touching the player's profile folder.
async function prepareStream(game) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const worker = new Worker("../worker.js", { type: "module" });
    try {
      return await new Promise((resolve, reject) => {
        worker.onerror = () => reject(new Error("Could not prepare game files. Try Play again."));
        worker.onmessage = ({ data }) => {
          if (data.diagnostic) { noteDownload(data.diagnostic); return; }
          if (data.progress) {
            const p = data.progress;
            diagnostics.startupProgress = { ...p, at: new Date().toISOString() };
            status(`Loading game… ${p.bytesTotal ? Math.floor(p.bytesDone / p.bytesTotal * 100) : 0}%`);
          } else if (data.error) {
            const error = new Error(data.error);
            if (data.name) error.name = data.name;
            if (data.stack) error.stack = data.stack;
            if (data.context) diagnostics.workerFailure = data.context;
            reject(error);
          } else if (data.result?.result === "done") resolve(data.result);
          else if (data.result?.result === "noSpace") {
            diagnostics.workerFailure = data.result;
            reject(noSpaceError(data.result));
          }
          else {
            const failure = data.result || {};
            diagnostics.workerFailure = failure;
            const error = new Error(failure.error || `Startup download failed: ${failure.result}`);
            if (failure.name) error.name = failure.name;
            if (failure.stack) error.stack = failure.stack;
            reject(error);
          }
        };
        worker.postMessage({ id: 1, cmd: "streamSetup", game });
      });
    } catch (error) {
      if (attempt === 0 && staleStorageError(error)) {
        console.warn("[browser] browser storage changed during startup; reopening it once");
        status("Browser storage changed… reopening it once");
        continue;
      }
      throw error;
    } finally {
      worker.terminate();
    }
  }
}

function webGpuUnavailableError() {
  const ua = navigator.userAgent || "";
  if (/Android/i.test(ua))
    return new Error("This Android device or browser does not provide WebGPU. Open the game in the current Chrome app. If current Chrome shows this message too, this device cannot run this build.");
  if (/iPhone|iPad|iPod/i.test(ua))
    return new Error("This iPhone or iPad does not provide the WebGPU support this build needs. This device cannot run the game yet.");
  return new Error("This browser could not start WebGPU. Turn on hardware acceleration and restart the browser. If that does not work, update the graphics driver or use the current Chrome or Edge version.");
}

// options (from the game's start page): profile, a save slot name like
// ?profile=; online, {relay, name, claim} like ?mp= and &name=; lan, {url, name, claim}
// like ?lan=ws://host:port: the game's own online code over the server's
// virtual LAN (lan.js; RECOMP_LAN turns the kit's Winsock on).
async function start(options = {}) {
  startup("browser checks");
  if (!crossOriginIsolated) {
    if (/Instagram/i.test(navigator.userAgent || ""))
      throw new Error("The game cannot run inside Instagram's browser. Open Instagram's menu and choose Open in browser, or copy this page's link into Chrome or Safari.");
    throw new Error("The game needs a secure browser environment that this page does not provide. Open this link directly in Chrome or Safari. If it still fails, send a report.");
  }
  if (!navigator.gpu) throw webGpuUnavailableError();
  await waitForPhoneLandscape();
  startup("reading game information");
  const id = await gameId();
  const games = await fetch("../games.json").then((r) => r.json());
  const game = games.find((g) => g.id === id);
  if (!game) throw new Error(`No game "${id}" in the launcher's games.json.`);
  document.title = game.title;

  // Full imports still boot locally; hosted games prepare only verified startup modules.
  startup("checking game files");
  let stream = null;
  let dir = await navigator.storage.getDirectory();
  let complete = false;
  try {
    for (const p of [id, "game"]) dir = await dir.getDirectoryHandle(p);
    const stamp = await (await (await dir.getFileHandle(".stamp")).getFile()).text();
    complete = stamp.trim() === game.sha256;
  } catch {}
  if (!complete && options.localOnly) throw new Error("Local game files are incomplete. Import your game folder again. Game-file streaming is disabled for this launch.");
  if (!complete && game.streamAssets && game.downloadManifest) {
    startup("preparing game files");
    status("Loading game…");
    stream = await prepareStream(game);
  } else if (!complete) throw new Error(`Import ${game.title} from the launcher before playing.`);
  window.carbonTestAssets = { NIS: !!stream };
  if (!stream) {
    try { await dir.getDirectoryHandle("NIS"); window.carbonTestAssets.NIS = true; }
    catch { console.warn("[browser] NIS scene data is missing; resume Import Windows installation."); }
  }
  const customizationReady = id === "nfsc";
  if (customizationReady) {
    startup("preparing customization assets");
    await (await import(new URL("./custom-install.js", document.baseURI).href)).prepareCustomization(status, {stream: !!stream, streamBase: stream?.base, assetBase: ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) ? "./custom-assets/" : "https://assets.nfscrb.xyz/customization/5911a37d9f9bc652b3fa457127273970b0d2a5e0e87c7081fb789a2c05439dbc/"});
  }
  if (id === "nfsc" && !stream) {
    await (await import(new URL("./billboards.js", document.baseURI).href)).prepareBillboards(status, {enabled: new URLSearchParams(location.search).get("billboards") !== "0"});
  }
  if (id === "nfsc" && !stream && ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) && !window.recompSite) {
    await (await import(new URL("./cockpit-assets.js", document.baseURI).href)).prepareCockpitAssets(startup);
  }
  const streamChannel = new BroadcastChannel("recomp-stream");
  if (stream) {
    window.recompStream = {
      prepareModels: keys => streamChannel.postMessage({ type: "prefetch-models", keys }),
      prepareFiles: paths => streamChannel.postMessage({ type: "prefetch", paths }),
    };
    if (game.streamPreparationScript) {
      const prepare = document.createElement("script");
      prepare.src = game.streamPreparationScript;
      document.body.append(prepare);
    }
  }
  let activeLoads = 0;
  let streamFailed = false;
  streamChannel.onmessage = ({ data }) => {
    if (data.type === "stats") window.recompStreamStats = data;
    if (data.type === "unavailable") {
      window.carbonTestAssets.unavailable = {
        path: String(data.path || "").slice(0, 300),
        message: String(data.message || "").slice(0, 500),
      };
      if (streamFailed) return;
      streamFailed = true;
      console.error("[stream] required game file unavailable", data.path || "(unknown file)", data.message || "");
      reportFailure("stream", new Error(
        "A game file could not be loaded. Check your connection and reload. Your saves are kept."));
    }
    if (data.type === "loading") {
      activeLoads = Math.max(0, activeLoads + (data.busy ? 1 : -1));
      if (!streamFailed) status(activeLoads ? "Loading…" : "");
    }
  };

  startup("starting graphics adapter");
  let adapter;
  for (const options of [{ powerPreference: "high-performance" }, undefined]) {
    try {
      adapter = await navigator.gpu.requestAdapter(options);
      diagnostics.adapterRequests.push({ preference: options?.powerPreference || "default", available: !!adapter });
    } catch (error) {
      diagnostics.adapterRequests.push({ preference: options?.powerPreference || "default", error: errorDetails(error) });
      console.warn("[browser] WebGPU adapter request failed", error?.message || String(error));
    }
    if (adapter) break;
    if (options) console.warn("[browser] high-performance WebGPU adapter unavailable; trying the browser default");
  }
  if (!adapter) throw webGpuUnavailableError();
  const info = adapter.info || {};
  window.carbonGraphicsInfo = {
    source: "active device adapter", preference: diagnostics.adapterRequests.at(-1)?.preference,
    features: Array.from(adapter.features),
    vendor: info.vendor || "", architecture: info.architecture || "",
    device: info.device || "", description: info.description || "",
    fallback: adapter.isFallbackAdapter ?? info.isFallbackAdapter ?? null,
  };
  if (window.carbonGraphicsInfo.fallback === true ||
      /swiftshader/i.test([info.vendor, info.architecture, info.device, info.description].join(" "))) {
    throw new Error("The browser selected a software renderer. This game needs a hardware graphics device. Turn on hardware acceleration in the browser settings, restart the browser, and try again. On Linux, check chrome://gpu for driver errors. Your saves are kept.");
  }
  const wanted = ["texture-compression-bc", "depth32float-stencil8", "float32-filterable",
                  "unorm16-texture-formats", "rg11b10ufloat-renderable"];
  if (window.recompPerformance?.enabled) wanted.push("timestamp-query");
  let requiredFeatures = wanted.filter((f) => adapter.features.has(f));
  const requiredLimits = {};
  for (const k of ["maxTextureDimension2D", "maxBufferSize", "maxStorageBufferBindingSize",
                   "maxUniformBufferBindingSize", "maxBindGroups", "maxSampledTexturesPerShaderStage",
                   "maxSamplersPerShaderStage", "maxStorageBuffersPerShaderStage",
                   "maxUniformBuffersPerShaderStage", "maxDynamicUniformBuffersPerPipelineLayout",
                   "maxVertexBuffers", "maxVertexAttributes", "maxColorAttachments",
                   "maxInterStageShaderVariables"])
    if (k in adapter.limits) requiredLimits[k] = adapter.limits[k];
  diagnostics.requestedDevice = { features: requiredFeatures, limits: requiredLimits };
  startup("starting graphics device");
  let device;
  try { device = await adapter.requestDevice({ requiredFeatures, requiredLimits }); }
  catch (error) {
    // Optional diagnostics must not prevent a previously supported game from starting.
    if (!requiredFeatures.includes("timestamp-query")) throw error;
    requiredFeatures = requiredFeatures.filter(f => f !== "timestamp-query");
    diagnostics.requestedDevice.features = requiredFeatures;
    device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
  }
  device.lost.then((info) => {
    reportFailure("graphics-device-lost",
      new Error(`The graphics device stopped: ${info.message}. Your saves are kept.`));
    // A lost GPUDevice cannot be repaired by recreating its swapchain. Unload
    // this document, including its native threads and pending GPU callbacks.
    // The recovery document never starts the runtime, so this cannot loop.
    const recovery = new URL(location.href);
    recovery.searchParams.set("graphicsRecovery", "1");
    location.replace(recovery.href);
  });
  device.addEventListener("uncapturederror", (e) => console.error("WebGPU:", e.error.message));

  startup("opening player profile");
  const exe = `/opfs/${id}/game/${game.executable}`;
  const profile = await profileFolder(id, options.profile);
  const renderScale = await savedRenderScale(game, profile);
  // ?mp=<relay address>: online play. The game's client (net.js) links the
  // game to the relay, and the game keeps running while another window has
  // the keyboard.
  if (options.online) window.recompOnline = options.online;
  const online = !!options.online || new URLSearchParams(location.search).has("mp");
  if (online) {
    const net = document.createElement("script");
    net.src = "net.js";
    net.onerror = () => console.warn("[browser] this game has no online client (net.js)");
    document.body.append(net);
    if (id === "nfsc") {
      const encounter = document.createElement("script");
      encounter.src = "encounter.js";
      document.body.append(encounter);
    }
  }
  const lanUrl = options.lan?.url || new URLSearchParams(location.search).get("lan");
  if (lanUrl) {
    window.recompLan = { url: lanUrl, name: options.lan?.name || options.online?.name || "", claim: options.lan?.claim || "" };
    const lan = document.createElement("script");
    lan.src = "lan.js";
    lan.onerror = () => console.warn("[browser] the virtual LAN client (lan.js) is missing");
    document.body.append(lan);
  }
  const Module = {
    canvas,
    preinitializedWebGPUDevice: device,
    noInitialRun: true,
    getPreloadedPackage(_name, size) {
      if (runtimeLoader?.active) { runtimeLoader.data.total = size; runtimeLoader.data.started = true; renderRuntimeLoader(); }
      return null; // Let Emscripten fetch and install the archive as before.
    },
    instantiateWasm(imports, receiveInstance) {
      loadRuntime(imports).then(({ instance, module }) => receiveInstance(instance, module))
        .catch(error => reportFailure("runtime-load", error));
      return {}; // Emscripten waits for receiveInstance for asynchronous loading.
    },
    print: (t) => { log.push(t); console.log(t); },
    printErr: (t) => { log.push(t); console.warn(t); },
    setStatus: (t) => {
      const progress = /^(Downloading data\.{3})\s*\((\d+)\/(\d+)\)$/.exec(t || "");
      if (progress) {
        const received = Number(progress[2]), total = Number(progress[3]);
        diagnostics.runtimeDataProgress = { received, advertisedTotal: total, at: new Date().toISOString(),
          comparable: total > 0 && received <= total };
        // Content-Length may describe compressed transfer bytes while the
        // loader counts decompressed bytes. Do not show an impossible ratio.
        if (runtimeLoader?.active) {
          const data = runtimeLoader.data; data.received = received;
          data.done = data.total > 0 && received >= data.total;
          renderRuntimeLoader(); return;
        }
        return status(received > total || !total ? `Downloading data… ${humanBytes(received)} received` : t);
      }
      status(t || "");
    },
    onAbort: (what) => reportFailure("abort", what),
    preRun: [() => {
      const m = Module;
      // Imported files and streamed assets can both wait on browser storage.
      // Let other guest threads run while the file reader waits.
      m.ENV.RECOMP_FILE_READ_YIELD = "1";
      if (stream) {
        if (new URLSearchParams(location.search).get("billboards") !== "0") m.ENV.RECOMP_BILLBOARD_OVERLAY = new URL("./billboard-stream.js", document.baseURI).href;
        m.ENV.RECOMP_WEB_ASSET_BASE = stream.base;
        m.ENV.RECOMP_WEB_ASSET_INDEX = stream.index;
        if (stream.manifest) m.ENV.RECOMP_WEB_ASSET_MANIFEST = stream.manifest;
      }
      m.ENV.RECOMP_PROFILE_DIR = `/opfs/${id}/${profile}`;
      if (renderScale !== undefined) m.ENV.RECOMP_D3D9_SCALE = renderScale;
      if (online || lanUrl) m.ENV.RECOMP_KEEP_ACTIVE = "1";
      if (lanUrl) m.ENV.RECOMP_LAN = "1";
      const extra = new URLSearchParams(location.search);
      for (const [k, v] of extra) if (k.startsWith("RECOMP_")) m.ENV[k] = v;
      // An exhausted upload budget or opt-out must also disable native measurement.
      m.ENV.RECOMP_PERF_REPORTS = window.recompPerformance?.enabled ? "1" : "0";
      m.ENV.RECOMP_COCKPIT = id === "nfsc" && ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) && !window.recompSite ? "1" : "0";
      m.ENV.RECOMP_CUSTOMIZATION = customizationReady ? "1" : "0";
      m.ENV.RECOMP_CUSTOM_COSMETICS_SHOP = customizationReady ? "1" : "0";
      m.ENV.RECOMP_CUSTOM_VECTOR_RESOURCE_SHA256 = customizationReady ? globalThis.__carbonCustomVectorResourceSha256 : "";
    }],
    onRuntimeInitialized() {
      if (statusFailed) return;
      startup("starting game code");
      stopRuntimeLoader();
      status("");
      gameRunning = true;
      canvas.focus();
      try { Module.callMain([`--exe=${exe}`]); }
      catch (error) { reportFailure("main", error); }
    },
  };
  window.Module = Module;
  startup("loading game runtime");
  beginRuntimeLoader();
  const script = document.createElement("script");
  script.src = "@APP@.js";
  script.onerror = () => reportFailure("runtime-script", new Error("The game's web build is missing."));
  document.body.append(script);
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("click", () => canvas.focus());

// A game may have a start page (its web/start.js): it shows first and calls
// recompBoot when the player presses Play. An address with developer settings
// (?mp=, ?lan=, ?profile=, RECOMP_*) starts the game at once, as does a game without one.
let booted = false;
window.recompBoot = (options) => {
  if (canonicalRedirect || graphicsRecovery || booted) return;
  booted = true;
  status("Loading…");
  start(options).catch(reportStartupFailure);
};
(async () => {
  if (canonicalRedirect) return;
  if (graphicsRecovery) {
    reportFailure("graphics-device-lost", new Error("The graphics device stopped. The game has been stopped to prevent repeated graphics errors. Select Back to game to try again. If this repeats, restart the browser and check hardware acceleration and your graphics driver. Your saves are kept."));
    return;
  }
  const params = [...new URLSearchParams(location.search).keys()];
  if (params.some((k) => k === "mp" || k === "lan" || k === "profile" || k.startsWith("RECOMP_"))) return recompBoot();
  const id = await gameId();
  const games = await fetch("../games.json").then((r) => r.json()).catch(() => []);
  const game = games.find((g) => g.id === id);
  window.recompGame = { id, executable: game?.executable || "", title: game?.title || "", sha256: game?.sha256 || "", downloadManifest: game?.downloadManifest || "", streamAssets: !!game?.streamAssets };
  if (game) document.title = game.title;
  status("");
  const page = document.createElement("script");
  page.src = "start.js";
  page.onerror = () => recompBoot();
  document.body.append(page);
})().catch((e) => status(e.message, true));
</script>
<script src="cockpit.js"></script></body>
</html>
