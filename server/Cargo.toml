[package]
name = "carbon-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Online server for the browser port of Need for Speed: Carbon: free-roam relay, cloud saves, and the switch of the virtual network for the game's own Online mode"

[[bin]]
name = "carbon-server"
path = "src/main.rs"

# Few and well known: tokio for sockets and timers, httparse (hyper's request parser) for
# request heads, serde_json for the JSON messages, and RustCrypto's SHA-1 (the WebSocket
# handshake) and SHA-256 (cloud save etags). HTTP keep-alive and WebSocket frames are this
# crate's own, as small as the Node relay's, so it behaves the same byte for byte.
[dependencies]
tokio = { version = "1.40", features = ["rt", "net", "io-util", "time", "fs", "sync", "macros"] }
httparse = "1.9"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
